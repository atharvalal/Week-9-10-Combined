<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roastery - Settings</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="login-container">
        <form class="login-form" id="settingsForm">
            <h2>Preferences</h2>
            <p>Manage your notification and display options</p>

            <div class="settings-list">
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Email Notifications</h4>
                        <p>Receive order and system updates</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Compact View</h4>
                        <p>Optimize dashboard grid for smaller screens</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Two-Factor Auth</h4>
                        <p>Require security code on sign in</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button type="button" class="btn-secondary" id="dashboardBtn">Dashboard</button>
                <button type="submit" id="submitBtn">
                    <span class="btn-text">Save Preferences</span>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>

            <div class="form-actions" style="justify-content: center; margin-top: 25px; margin-bottom: 0;">
                <a href="profile.html" class="forgot-link" style="color: rgba(245, 230, 210, 0.6);">Go to Profile</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('dashboardBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });

        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const btnText = document.querySelector('.btn-text');
            const spinner = document.getElementById('spinner');

            btnText.style.display = 'none';
            spinner.style.display = 'block';
            btn.style.cursor = 'not-allowed';

            setTimeout(() => {
                btnText.style.display = 'block';
                btnText.innerText = 'Saved!';
                spinner.style.display = 'none';

                setTimeout(() => {
                    btnText.innerText = 'Save Preferences';
                    btn.style.cursor = 'pointer';
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
